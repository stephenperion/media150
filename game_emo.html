<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* FULLSCREEN SCENE */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .scene img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* BOTTOM DIALOGUE BOX */
        .ui-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: 85%;
            max-width: 900px;

            background-color: rgba(0, 0, 0, 0.85);
            color: #f2e6d2;

            padding: 20px;
            box-sizing: border-box;

            /* 🎮 GAME BORDER */
            border: 4px solid #f2e6d2;

            /* optional but makes it feel more “game UI” */
            outline: 2px solid #173f1e;
            outline-offset: -8px;
        }

        /* TEXT */
        #storyText {
            margin: 0;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* BUTTON STYLE (YOUR ORIGINAL STYLE KEPT) */
        .pixel-btn {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #f2e6d2;
            background-color: #6a8c5d;
            border: 4px solid #f2e6d2;
            padding: 12px 20px;
            cursor: pointer;

            box-shadow: 
                4px 4px 0px #173f1e,
                inset -2px -2px 0px #555,
                inset 2px 2px 0px #999;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pixel-btn:hover {
            background-color: #5a7a4d;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
        }

        /* BUTTON CONTAINER */
        .choices {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

    <div class="scene">
        <img src="4_train.jpg" alt="background">
    </div>

    <!-- UI OVERLAY -->
    <div class="ui-box">
        <p id="storyText">
            I followed this path into a train!
        </p>

        <div class="choices">
            <a href="game_trainride.html">
                <button class="pixel-btn">Continue riding the train till the last stop...</button>
            </a>
        </div>
    </div>

</body>
