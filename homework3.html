<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Homework 3</title>

    <style>
        body {
            margin: 0; 
            background-image: url(homeworkandreadingbg.jpg);
            background-size: cover;
            background-position: center;
            font-family:'Courier New', Courier, monospace;
        }

        header {
            background-color: rgb(235, 64, 52);

            margin: 10px;

            padding: 20px;
            border-radius: 8px;
        }

        .div-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin: 10px;
            justify-content: center;
        }

        .background { 
            background-color: rgb(96, 125, 181);
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>

</head>

<body>
    
    <header> 
        <div>
            <a href="homework.html" style="color: white;"><- Back</a>
        </div>
    </header>

    <div>
        <div class="div-layout">
            <div class="background">
                <img src="deep_dof.JPEG" width="350">
                <br>
                <p><strong>Depth of Field</strong></p>
            </div>

            <div class="background">
                <img src="shallow_dof.JPEG" width="350">
                <br>
                <p><strong>Shallow Depth of Field</strong></p>
            </div>
        </div>
    </div>

    <div> 
        <div class="div-layout">
            <div class="background">
                    <img src="blur_unfinished.JPEG" width="350">
                    <br>
                    <p><strong>Original Image</strong></p>
            </div>

            <div class="background">
                <img src="blur_finished.png" width="350">
                <br>
                <p><strong>Blurred Image</strong></p>
            </div>
        </div>
    </div>

    <div class="div-layout">
        <div class="background">
                <img src="raw_unedited.JPG" width="350">
                <br>
                <p><strong>Original Image -- Raw</strong></p>
        </div>

        <div class="background">
            <img src="raw_edited.jpg" width="350">
            <br>
            <p><strong>Edited Image -- JPG</strong></p>
        </div>
    </div>

</html>
